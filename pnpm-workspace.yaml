  - langium@3.3.1

packages:
  - apps/*
  - packages/*

overrides:
  h3: 1.15.11
  nitro@3.0.260610-beta>h3: 2.0.1-rc.22
  oxc-parser: 0.102.0
  semver: 7.7.3

updateConfig:
